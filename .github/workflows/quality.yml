name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-integrity:
    name: docs-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate Markdown references and project contract
        run: node scripts/validate-docs.mjs

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

  workspace:
    name: workspace (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22"
          - os: ubuntu-24.04
            node: "24"
          - os: macos-15
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.9 --ignore-scripts
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting, lint, types, fixtures, schema and CLI parity
        run: pnpm check
      - name: Package and validate deterministic CLI provenance
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        shell: bash
        run: |
          first="$RUNNER_TEMP/arkcompat-cli-provenance-a"
          second="$RUNNER_TEMP/arkcompat-cli-provenance-b"
          pnpm package:cli "$first"
          pnpm verify:runtime-provenance "$first"
          pnpm package:cli "$second"
          pnpm verify:runtime-provenance "$second"
          cmp "$first/SBOM.cdx.json" "$second/SBOM.cdx.json"
          cmp "$first/THIRD-PARTY-NOTICES.json" "$second/THIRD-PARTY-NOTICES.json"
          cmp "$first/SHA256SUMS" "$second/SHA256SUMS"
          node "$first/dist/index.js" --help > "$RUNNER_TEMP/arkcompat-cli-provenance-help.txt"
      - name: Retain CLI provenance rehearsal, not a release
        if: ${{ always() && matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-runtime-provenance-rehearsal-not-release
          path: ${{ runner.temp }}/arkcompat-cli-provenance-a/
          if-no-files-found: error
          retention-days: 14
      - name: Retain shared unit coverage evidence
        if: ${{ always() && matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-unit-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Run the local inventory action on a developer fixture
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        id: inventory-action
        uses: ./.github/actions/arkcompat-scan
        with:
          project: fixtures/developer/yarn-berry-graph
          runtime: arkts
          release: "6.0.0"
          api-level: "20"
      - name: Verify action and CLI report parity
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        env:
          ARKCOMPAT_ACTION_REPORT: ${{ steps.inventory-action.outputs.report-path }}
        run: |
          node apps/cli/dist/index.js scan fixtures/developer/yarn-berry-graph --runtime arkts --release 6.0.0 --api-level 20 > "$RUNNER_TEMP/arkcompat-action-expected.json"
          cmp "$RUNNER_TEMP/arkcompat-action-expected.json" "$ARKCOMPAT_ACTION_REPORT"
      - name: Generate label-blind developer dependency predictions
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        run: pnpm --silent evaluate predict-dependencies fixtures/developer/inventory fixtures/developer/dependency-evaluation/cases.json > "$RUNNER_TEMP/arkcompat-root-predictions.json"
      - name: Evaluate the developer dependency predictions
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        run: |
          pnpm evaluate fixtures/developer/dependency-evaluation/labels.json "$RUNNER_TEMP/arkcompat-root-predictions.json" "$RUNNER_TEMP/arkcompat-root-evaluation"
          cd "$RUNNER_TEMP/arkcompat-root-evaluation"
          sha256sum --check SHA256SUMS
          jq -e '.acceptance == "not-adjudicated" and .independence == "unverified" and .total.labeled == 3 and .total.tp == 1 and .total.tn == 2 and .total.fp == 0 and .total.fn == 0' results.json
      - name: Generate developer-only evaluation example
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        run: pnpm evaluate fixtures/developer/evaluation/labels.json fixtures/developer/evaluation/predictions.json "$RUNNER_TEMP/arkcompat-developer-evaluation"
      - name: Verify developer example checksums
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        working-directory: ${{ runner.temp }}/arkcompat-developer-evaluation
        run: sha256sum --check SHA256SUMS
      - name: Retain developer-only evaluation example
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == '24' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-evaluation-example-not-acceptance
          path: ${{ runner.temp }}/arkcompat-developer-evaluation/
          if-no-files-found: error
          retention-days: 14
